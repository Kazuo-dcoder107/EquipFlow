; EquipFlow kiosk firmware (ESP32 + RC522 + 1602 I2C LCD + 3 arcade buttons + buzzer)
;   pio run                      build the kiosk firmware        (env: kiosk, default; needs include/secrets.h)
;   pio run -t upload            flash it
;   pio run -e kiosk_mock -t upload   offline demo against the built-in fake server (no Wi-Fi, no secrets.h)
;   pio run -e hw_net -t upload  test Wi-Fi + server alone, before running the whole kiosk
;   pio test -e native           run the unit tests on your PC (no hardware needed)
;   pio run -e hw_lcd -t upload  flash one hardware test sketch (hw_lcd, hw_rfid, hw_button, hw_buzzer)

[platformio]
default_envs = kiosk

[env:kiosk]
platform = espressif32@6.9.0          ; arduino-esp32 2.0.17 (the buzzer code uses the 2.x LEDC API)
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall
lib_deps =
    miguelbalboa/MFRC522@1.4.11
    marcoschwartz/LiquidCrystal_I2C

; ---- offline demo: same firmware, fake server (mock_data.h) ----
[env:kiosk_mock]
extends = env:kiosk
build_flags = ${env:kiosk.build_flags} -DUSE_MOCK_API

; ---- step 3: Wi-Fi + server test, no kiosk logic ----
[env:hw_net]
extends = env:kiosk
build_src_filter = -<*> +<../hwtests/net_test.cpp>

; ---- step 1 hardware test sketches: one part at a time ----
[env:hw_lcd]
extends = env:kiosk
build_src_filter = -<*> +<../hwtests/lcd_test.cpp>

[env:hw_rfid]
extends = env:kiosk
build_src_filter = -<*> +<../hwtests/rfid_test.cpp>

[env:hw_button]
extends = env:kiosk
build_src_filter = -<*> +<../hwtests/button_test.cpp>

[env:hw_buzzer]
extends = env:kiosk
build_src_filter = -<*> +<../hwtests/buzzer_test.cpp>

; ---- unit tests on the PC: state machine, button decoder, text, tones ----
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_ignore = kiosk_hw
